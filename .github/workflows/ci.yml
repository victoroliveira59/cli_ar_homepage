name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-audit:
    name: Build, Test and SEO Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application (SSR + Prerender)
        run: npm run build

      - name: Run unit tests (ChromeHeadless)
        run: npm run test:ci

      - name: Run SEO audit
        run: npm run seo:audit
