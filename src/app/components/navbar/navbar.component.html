<nav #nav class="navbar navbar-expand-lg fixed-top navbar-dark "
     [ngClass]="{'minha-navbar ': scrolled, 'bg-transparent': !scrolled}">

  <!-- Logo posicionada absolutamente fora do container -->
  <div class="logo-absolute-wrapper" [class.scrolled]="scrolled">
    <a class="navbar-brand" href="#home">
      <img src="/assets/img/logo/Logo_AR_Branca.png"
           class="logo-img"
           alt="Logo">
    </a>
  </div>

  <div class="container">

    <!-- Botão Hamburguer -->
    <button class="navbar-toggler"
        type="button"
        (click)="toggleMenu()"
        [class.collapsed]="!menuAberto"
        aria-expanded="menuAberto"
        aria-label="Toggle navigation">
        <span class="navbar-icon">
          <span class="icon-bar top-bar"></span>
          <span class="icon-bar middle-bar"></span>
          <span class="icon-bar bottom-bar"></span>
        </span>
    </button>

    <!-- Links de Navegação -->
    <div class="collapse navbar-collapse" [class.show]="menuAberto" (click)="closeMenu()">
      <div class="menu-content" (click)="$event.stopPropagation()">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="#home" (click)="scrollToSection($event, 'home')">
              <i class="fas fa-home mr-1"></i> Home
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#servicos" (click)="scrollToSection($event, 'servicos')">
              <i class="fa-solid fa-snowflake mr-1"></i> Serviços
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#sobre" (click)="scrollToSection($event, 'sobre')">
              <i class="fas fa-users mr-1"></i> Sobre Nós
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#contato" (click)="scrollToSection($event, 'contato')">
              <i class="fas fa-phone-alt mr-1"></i> Contato
            </a>
          </li>
        </ul>
      </div>
    </div>

  </div>
</nav>
