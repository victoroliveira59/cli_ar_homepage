<div class="servicos-container">
  <div class="servicos-header">
    <span class="section-badge">
      <i class="fas fa-snowflake"></i> Assistência Técnica Especializada
    </span>
    <h1 class="section-title">Conserto e Assistência Técnica em Refrigeração em Nova Lima</h1>
    <p class="section-subtitle">
      Ar-condicionado, geladeiras, freezers, chopeiras e bebedouros em
      <strong>Nova Lima e região</strong> — com garantia de 90 dias.
    </p>
  </div>

  <div class="carousel-container">
    <ngx-slick-carousel [config]="slideConfig" #slickModal="slick-carousel">
      <div ngxSlickItem *ngFor="let servico of servicos">
        <div class="slide-wrapper">
          <!-- Imagem de fundo -->
          <img class="carousel-bg-img" [src]="servico.imagem" [alt]="servico.nome" width="1200" height="520" loading="lazy">
          <!-- Overlay gradiente -->
          <div class="carousel-overlay"></div>
          <!-- Conteúdo -->
          <div class="carousel-content">
            <div class="service-icon-badge">
              <i class="fas {{servico.icon}}"></i>
            </div>
            <h3>{{ servico.nome }}</h3>
            <p>{{ servico.descricao }}</p>
            <div class="carousel-actions">
              <button class="btn-saiba-mais" (click)="openModal(servico)">
                <i class="fas fa-plus-circle"></i> Resumo
              </button>
              <a class="btn-detalhes" [routerLink]="['/servicos', servico.slug]">
                <i class="fas fa-arrow-right"></i> Ver Página Completa
              </a>
            </div>
          </div>
        </div>
      </div>
    </ngx-slick-carousel>

    <!-- Controles -->
    <button class="carousel-control carousel-control-prev" (click)="slickModal.slickPrev()" aria-label="Anterior">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button class="carousel-control carousel-control-next" (click)="slickModal.slickNext()" aria-label="Próximo">
      <i class="fas fa-chevron-right"></i>
    </button>
  </div>
</div>

<app-modal [isOpen]="isModalOpen" [title]="modalTitle" [description]="modalDescription" (closeModal)="closeModal()">
</app-modal>
