<section id="servicos">
	<div class="servicos-container">
	  <h1>Nossos Serviços</h1>

	  <div class="centralizador">
		<ngx-slick-carousel class="carousel" [config]="slideConfig">
		  <div ngxSlickItem *ngFor="let servico of servicos" class="slide">
			<img [src]="servico.imagem" [alt]="servico.nome" class="img-style">
			<h3>{{ servico.nome }}</h3>
			<p>{{ servico.descricao }}</p>
		  </div>
		</ngx-slick-carousel>
	  </div>
	</div>
  </section>
